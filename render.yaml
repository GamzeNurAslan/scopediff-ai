services:
  - type: web
    name: scopediff-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.render.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://gamzenuraslan.github.io,http://localhost:5173,http://127.0.0.1:5173
      - key: SCOPEDIFF_LIGHTWEIGHT_MODE
        value: "true"
